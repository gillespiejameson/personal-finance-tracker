name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Dates are local calendar days, so a test that hard-codes one can pass
      # in UTC and fail for contributors elsewhere. Run at both ends of the clock.
      - name: Test (UTC+14)
        run: npm test
        env:
          TZ: Pacific/Kiritimati

      - name: Test (UTC-11)
        run: npm test
        env:
          TZ: Pacific/Pago_Pago

      - name: Build
        run: npm run build
